[project]
name = "selfbot"
version = "2026.02.12"
description = "Telegram Selfbot"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dnspython>=2.6.1",
    "httpx[http2]==0.28.1",
    "pillow>=11.0.0",
    "pymongo>=4.9.0",
    "pyrotgfork==2.2.18",
    "psutil>=6.1.1",
    "speedtest-cli>=2.1.3",
    "telegraph[aio]==2.2.0",
    "pytgcrypto==1.2.12",
    "py-yt-search>=0.5.7",
    "playwright",
]

[project.scripts]
selfbot = "selfbot.main:run"

[tool.uv]
package = true
