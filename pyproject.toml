[project]
name = "selfbot"
version = "2026.02.12"
description = "Telegram Selfbot"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dnspython>=2.6.1",
    "httpcore==1.0.9",
    "kurigram==2.2.26",
    "richpyro>=1.0.0",
    "pillow>=12.3.0",
    "pymongo>=4.18.2",
    "psutil>=6.1.1",
    "speedtest-cli>=2.1.3",
    "py-yt-search>=0.8.0",
    "edge-tts>=7.0.0",
    "pytgcrypto==1.2.12",
    "google-genai",
    "yt-dlp>=2026.8.19",
    "py-tgcalls>=3.0.0",
    "httpx>=0.28.1",
    "h2>=4.4.1",
]

[project.scripts]
selfbot = "selfbot.main:run"

[tool.uv]
package = true

[tool.setuptools]
packages = ["selfbot"]
