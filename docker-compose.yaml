services:
  selfbot:
    build: .
    env_file:
      - .env
    container_name: selfbot
    restart: unless-stopped
    working_dir: /srv/selfbot
    volumes:
      - .:/srv/selfbot
    environment:
      - TZ=Asia/Jakarta
    command: ["python", "-m", "selfbot"]
    cpus: 0.5            
    mem_limit: 512m
