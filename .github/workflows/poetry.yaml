name: Poetry Update
permissions:
  contents: read
'on':
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch: null
jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - uses: fuzzylabs/gha-poetry-update@v1.0.2
        with:
          python-version: '3.13'
          poetry-version: 2.2.1
