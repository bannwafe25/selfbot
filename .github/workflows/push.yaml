name: Push

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Login
      uses: docker/login-action@v3
      with:
        username: beepsound
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build - Push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: beepsound/selfbot:staging
